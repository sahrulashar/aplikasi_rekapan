server {
    listen 80;
    server_name aidenwebafiq.site www.aidenwebafiq.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aidenwebafiq.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aidenwebafiq.site www.aidenwebafiq.site;

    ssl_certificate     /etc/letsencrypt/live/aidenwebafiq.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidenwebafiq.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    location / {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
