<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Aplikasi</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    .login-title {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      color: #002b70;
    }

    .login-subtitle {
      margin: 8px 0 22px;
      color: #003b88;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      border: 1px solid #d9dee8;
      border-radius: 13px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap .form-input {
      padding-right: 44px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      color: #64748b;
    }

    .login-btn {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 7px;
      background: #18181b;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 2px;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #000000;
      transform: translateY(-1px);
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .login-card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1 class="login-title">Login</h1>
    <p class="login-subtitle">My Aplikasi</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <input
          class="form-input"
          type="text"
          name="username"
          placeholder="Username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group password-wrap">
        <input
          id="passwordInput"
          class="form-input"
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >
        <button class="toggle-password" type="button" onclick="togglePassword()">👁</button>
      </div>

      <button class="login-btn" type="submit">Login</button>
    </form>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
