services:
  web:
    build: .
    container_name: aplikasi_rekapan
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Makassar
    volumes:
      - ./instance:/app/instance

  nginx:
    image: nginx:alpine
    container_name: aplikasi_rekapan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
