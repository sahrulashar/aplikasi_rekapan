services:
  web:
    build: .
    container_name: aplikasi_rekapan
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - TZ=Asia/Makassar
    volumes:
      - ./instance:/app/instance

  nginx:
    image: nginx:alpine
    container_name: aplikasi_rekapan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: aplikasi_rekapan_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
